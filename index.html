<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pressure – moved</title>
    <meta http-equiv="refresh" content="5; url=https://icis4.github.io/demoio/pressure/">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#00ADEF">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
    <link rel="canonical" href="https://icis4.github.io/demoio/pressure/">
    <style>
        :root {
            --accent: #00ADEF;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #616e7c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12161c;
                --card: #1c222b;
                --text: #e4e7eb;
                --muted: #9aa5b1;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        main {
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            background: var(--card);
            border-top: 4px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
            text-align: center;
        }

        h1 { margin: 0 0 12px; font-size: 1.6rem; }
        p { margin: 0 0 28px; color: var(--muted); line-height: 1.5; }

        a.btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 6px;
        }

        a.btn:hover { filter: brightness(1.1); }

        small { display: block; margin-top: 20px; color: var(--muted); word-break: break-all; }
    </style>
</head>

<body>
    <main>
        <h1>This page has moved</h1>
        <p>The Pressure demo is no longer maintained here.<br>You will be redirected to the new version in a few seconds.</p>
        <a class="btn" href="https://icis4.github.io/demoio/pressure/">Open the new Pressure demo</a>
        <small>https://icis4.github.io/demoio/pressure/</small>
    </main>
    <script>
        // Remove the old offline service worker and its caches.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }
        if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
    </script>
</body>

</html>
